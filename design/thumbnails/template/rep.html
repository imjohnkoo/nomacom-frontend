<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>대표 썸네일 렌더 타깃</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="../shared/thumb.css" />
    <style>
      /* 렌더 전용 — 스크롤바가 캡처에 섞이지 않도록 여백 0 */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
        overflow: hidden;
      }
      #mount {
        width: 1000px;
        height: 1000px;
      }
    </style>
  </head>
  <body>
    <!--
      배치 렌더러의 스크린샷 대상. render.mjs 가 locator('#mount > .canvas') 로 찍는다.
      쿼리 파라미터로 옵션을 받는다:
        ?sku=EU022U&scheme=mono&model=male&logo=kor&sub=0
      렌더 완료 신호는 document.body.dataset.ready = '1'.
    -->
    <div id="mount"></div>
    <script type="module">
      import { createCanvas, fitTitle, loadIndex, fontsReady, DEFAULTS } from '../shared/thumb.js'

      const q = new URLSearchParams(location.search)
      const opts = {
        scheme: q.get('scheme') ?? DEFAULTS.scheme,
        model: q.get('model') ?? DEFAULTS.model,
        modelLayer: q.get('modelLayer') ?? DEFAULTS.modelLayer,
        logo: q.get('logo') ?? DEFAULTS.logo,
        showSub: q.get('sub') === '1',
        guides: false,
      }

      const index = await loadIndex('../data/thumbnails.json')
      const sku = q.get('sku')
      const item = index.items.find((i) => i.sku === sku)
      if (!item) {
        document.body.dataset.error = `알 수 없는 SKU: ${sku}`
        throw new Error(document.body.dataset.error)
      }

      const el = createCanvas(item, opts, '../assets')
      document.getElementById('mount').append(el)

      await fontsReady()
      const fit = fitTitle(el)
      document.body.dataset.fit = JSON.stringify(fit)
      document.body.dataset.ready = '1'
    </script>
  </body>
</html>
