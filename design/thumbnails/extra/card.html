<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>추가이미지 카드</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="../shared/tokens.css" />
    <style>
      /*
        추가이미지 5장 — 상세 갤러리에서만 보이고 검색 노출은 없다.
        대표이미지에서 배경·서체·pill 을 이어받되 모델은 쓰지 않는다:
        대표는 검색 그리드에서 시선을 끄는 게 목적이고 여기는 정보 전달이라
        인물이 자리만 먹는다. 한 장에 한 질문, 한 답.
      */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        overflow: hidden;
        background: #fff;
      }
      .canvas {
        width: 1000px;
        height: 1000px;
        position: relative;
        overflow: hidden;
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        color: #fff;
        /* 대표이미지와 동일한 보라 그라데이션 */
        background:
          radial-gradient(circle at 80% 0%, rgba(167, 139, 255, 0.5) 0%, transparent 55%),
          radial-gradient(circle at 0% 80%, rgba(80, 37, 232, 0.6) 0%, transparent 50%),
          linear-gradient(135deg, #2f1499 0%, #6239ff 100%);
        display: flex;
        flex-direction: column;
        padding: 50px;
      }

      /* ── 머리 ── */
      .head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
      }
      .head img {
        height: 96px;
        width: auto;
        display: block;
      }
      .step {
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 0.02em;
        color: rgba(255, 255, 255, 0.62);
        padding-top: 12px;
      }
      .step b {
        color: #fff;
        font-weight: 900;
      }

      /* ── 도식 ── */
      .art {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 12px 0 4px;
      }
      .art svg {
        display: block;
      }

      /* ── 카피 ── */
      .eyebrow {
        display: inline-block;
        align-self: flex-start;
        background: rgba(255, 255, 255, 0.18);
        border: 2px solid rgba(255, 255, 255, 0.28);
        border-radius: 999px;
        padding: 10px 24px;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.01em;
        margin-bottom: 26px;
      }
      .title {
        font-size: 104px;
        line-height: 1.14;
        font-weight: 800;
        letter-spacing: -0.02em;
        white-space: pre-line;
        word-break: keep-all;
        text-shadow: 0 8px 26px rgba(15, 5, 60, 0.4);
      }
      .sub {
        margin-top: 22px;
        font-size: 42px;
        line-height: 1.35;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: rgba(255, 255, 255, 0.94);
        word-break: keep-all;
      }
      .note {
        margin-top: 26px;
        display: inline-flex;
        align-self: flex-start;
        align-items: center;
        gap: 12px;
        background: #fff;
        color: var(--color-primary-700);
        border-radius: 16px;
        padding: 18px 26px;
        font-size: 31px;
        font-weight: 700;
        letter-spacing: -0.015em;
        line-height: 1.3;
        word-break: keep-all;
        max-width: 100%;
        box-shadow: 0 16px 34px -14px rgba(10, 2, 40, 0.5);
      }
      .note--warn {
        background: #fff1e6;
        color: #9a3412;
      }
      .note__dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: currentColor;
        flex: none;
        opacity: 0.55;
      }
    </style>
  </head>
  <body>
    <div class="canvas" id="canvas"></div>
    <script type="module">
      const ART = {
        // 단순 기하 도형으로 자체 제작 — 3D 일러스트 외주를 다시 만들지 않는다
        phones: `<svg width="520" height="300" viewBox="0 0 520 300" fill="none">
          <rect x="96" y="24" width="150" height="252" rx="26" stroke="#fff" stroke-width="9"/>
          <rect x="122" y="52" width="98" height="180" rx="10" fill="rgba(255,255,255,.18)"/>
          <circle cx="171" cy="256" r="9" fill="#fff"/>
          <circle cx="171" cy="150" r="46" fill="#4ade80"/>
          <path d="M152 150l14 15 26-29" stroke="#0b3a1e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="274" y="24" width="150" height="252" rx="26" stroke="rgba(255,255,255,.45)" stroke-width="9"/>
          <rect x="300" y="52" width="98" height="180" rx="10" fill="rgba(255,255,255,.08)"/>
          <circle cx="349" cy="150" r="46" fill="rgba(255,255,255,.22)"/>
          <path d="M333 134l32 32M365 134l-32 32" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
        </svg>`,
        qr: `<svg width="470" height="300" viewBox="0 0 470 300" fill="none">
          <g stroke="#fff" stroke-width="9">
            <rect x="150" y="18" width="76" height="76" rx="12"/>
            <rect x="150" y="206" width="76" height="76" rx="12"/>
            <rect x="338" y="18" width="76" height="76" rx="12"/>
          </g>
          <g fill="#fff">
            <rect x="172" y="40" width="32" height="32" rx="6"/>
            <rect x="172" y="228" width="32" height="32" rx="6"/>
            <rect x="360" y="40" width="32" height="32" rx="6"/>
            <rect x="264" y="18" width="26" height="26" rx="5"/>
            <rect x="264" y="112" width="26" height="26" rx="5"/>
            <rect x="310" y="112" width="26" height="26" rx="5"/>
            <rect x="150" y="112" width="26" height="26" rx="5"/>
            <rect x="196" y="112" width="26" height="26" rx="5"/>
            <rect x="264" y="206" width="26" height="26" rx="5"/>
            <rect x="310" y="252" width="26" height="26" rx="5"/>
            <rect x="356" y="206" width="26" height="26" rx="5"/>
            <rect x="388" y="252" width="26" height="26" rx="5"/>
          </g>
          <path d="M60 150h56M470 150h-56" stroke="rgba(255,255,255,.4)" stroke-width="8" stroke-linecap="round"/>
        </svg>`,
        dualsim: `<svg width="470" height="300" viewBox="0 0 470 300" fill="none">
          <rect x="70" y="46" width="180" height="230" rx="24" fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.5)" stroke-width="8"/>
          <text x="160" y="180" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="58" font-weight="800" fill="#fff">KR</text>
          <rect x="218" y="20" width="180" height="230" rx="24" fill="#fff"/>
          <text x="308" y="154" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="58" font-weight="900" fill="#5025e8">eSIM</text>
          <rect x="248" y="182" width="120" height="12" rx="6" fill="rgba(80,37,232,.25)"/>
          <rect x="248" y="206" width="82" height="12" rx="6" fill="rgba(80,37,232,.25)"/>
        </svg>`,
        toggle: `<svg width="470" height="270" viewBox="0 0 470 270" fill="none">
          <rect x="60" y="86" width="150" height="98" rx="49" fill="rgba(255,255,255,.18)" stroke="rgba(255,255,255,.45)" stroke-width="8"/>
          <circle cx="109" cy="135" r="32" fill="rgba(255,255,255,.6)"/>
          <path d="M248 135h56" stroke="rgba(255,255,255,.5)" stroke-width="9" stroke-linecap="round"/>
          <path d="M290 118l22 17-22 17" stroke="rgba(255,255,255,.5)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="330" y="86" width="150" height="98" rx="49" fill="#4ade80" transform="translate(-40,0)"/>
          <circle cx="391" cy="135" r="32" fill="#fff"/>
        </svg>`,
        refund: `<svg width="400" height="290" viewBox="0 0 400 290" fill="none">
          <circle cx="200" cy="145" r="108" stroke="rgba(255,255,255,.32)" stroke-width="12"/>
          <path d="M200 37a108 108 0 0 1 0 216" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
          <path d="M170 22l32 15-32 19" fill="#fff"/>
          <text x="200" y="172" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="72" font-weight="900" fill="#fff">100%</text>
        </svg>`,
      }

      const q = new URLSearchParams(location.search)
      const n = Number(q.get('n') ?? 1)
      const cfg = await (await fetch('../data/extra-cards.json', { cache: 'no-cache' })).json()
      const c = cfg.cards.find((x) => x.n === n)
      if (!c) {
        document.body.dataset.error = `알 수 없는 번호: ${n}`
        throw new Error(document.body.dataset.error)
      }

      document.getElementById('canvas').innerHTML = `
        <div class="head">
          <img src="../assets/logo/logo_light_kor.png" alt="이심마니" />
          <div class="step"><b>${c.n}</b> / ${cfg.cards.length}</div>
        </div>
        <div class="art">${ART[c.icon] ?? ''}</div>
        <div class="eyebrow">${c.eyebrow}</div>
        <div class="title">${c.title}</div>
        <div class="sub">${c.sub}</div>
        ${c.note ? `<div class="note ${c.noteTone === 'warn' ? 'note--warn' : ''}"><span class="note__dot"></span>${c.note}</div>` : ''}`

      await document.fonts.ready

      // 제목·보조가 안전 여백 안에 들어가는지 실측하고, 넘치면 줄인다.
      const canvas = document.getElementById('canvas')
      const fit = (sel, min) => {
        const el = canvas.querySelector(sel)
        if (!el) return null
        let size = parseFloat(getComputedStyle(el).fontSize)
        while (size > min && canvas.scrollHeight > 1000) {
          size -= 2
          el.style.fontSize = `${size}px`
        }
        return size
      }
      // 넘치면 보조 → 제목 순으로 양보시킨다 (제목이 마지막까지 크게 남도록)
      fit('.sub', 30)
      fit('.title', 68)
      document.body.dataset.overflow = canvas.scrollHeight > 1000 ? '1' : '0'
      document.body.dataset.metrics = JSON.stringify({
        title: parseFloat(getComputedStyle(canvas.querySelector('.title')).fontSize),
        sub: parseFloat(getComputedStyle(canvas.querySelector('.sub')).fontSize),
        height: canvas.scrollHeight,
      })
      document.body.dataset.ready = '1'
    </script>
  </body>
</html>
